openapi: 3.0.3
info:
  title: lavalink_mixer
  version: 1.0.0
  description: Overlay a clip over the music with the music ducked. Same auth as the Lavalink server.
paths:
  /mixer/announce:
    post:
      summary: Start a ducked overlay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guildId]
              properties:
                guildId: {type: string}
                encodedTrack: {type: string, description: Lavalink base64 track (preferred)}
                identifier: {type: string, description: Resolved by the server source managers}
                duckLevel: {type: number, minimum: 0, maximum: 1}
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  overlayId: {type: integer, format: int64}
                  track: {type: object}
        "400": {description: Bad request or unloadable clip}
        "409": {description: "overlay_busy | mixer_unavailable:main_idle | mixer_unavailable:filter_inactive"}
        "504": {description: Clip did not load in time; nothing started}
  /mixer/announce/cancel:
    post:
      summary: Stop the running overlay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guildId]
              properties:
                guildId: {type: string}
      responses:
        "204": {description: Stopped}
        "404": {description: No overlay running}
  /mixer/state:
    get:
      summary: Overlay state
      parameters:
        - {name: guildId, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: State
          content:
            application/json:
              schema:
                type: object
                properties:
                  guildId: {type: string}
                  overlayActive: {type: boolean}
                  overlayId: {type: integer, format: int64}
                  lastOverlay:
                    type: object
                    nullable: true
                    properties:
                      id: {type: integer, format: int64}
                      reason: {type: string, enum: [finished, cancelled, failed, stuck, timeout, main_stopped, play_failed]}
                  filterLive: {type: boolean}
                  duckLevel: {type: number}
                  duckFadeMs: {type: integer, format: int64}
        "404": {description: No mixer for the guild}
